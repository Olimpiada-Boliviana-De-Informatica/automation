- name: Install CMS base prerequisite packages
  become: yes
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - git
    - postgresql-client
    - libpq-dev
    - python3.12
    - python3.12-dev
    - python3.12-venv
    - libyaml-dev
    - zip
    - shared-mime-info
    - libffi-dev
    - build-essential
    - libcups2-dev
  tags: packages
  notify: Restart CMS

- name: Install CMS contest web service prerequisite packages
  become: yes
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - cppreference-doc-en-html
  tags: packages
  when: '"cms_contest_web" in services'
  notify: Restart CMS

- name: Install CMS worker required packages
  become: yes
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - build-essential
    - g++
    - libcap-dev
    - python3.12
    - python3.12-dev
    - python3.12-venv
    - zip
    - libpq-dev
    - libcups2-dev
    - libyaml-dev
    - libffi-dev
    - python3-pip
  tags: packages
  when: '"cms_worker" in services'
  notify: Restart CMS

- name: Create CMS group
  become: yes
  group:
    name: cmsuser
    system: yes
  notify: Restart CMS

- name: Create cmsuser user
  become: yes
  user:
    name: cmsuser
    shell: /bin/bash
    groups: [sudo, isolate]
    append: yes
    create_home: yes

- name: Create CMS ranking user
  become: yes
  user:
    name: cmsrankinguser
    comment: CMS ranking service user
    create_home: no
    shell: /bin/false
  when: '"cms_ranking" in services'
  notify: Restart CMS ranking service

- name: Add additional users to the CMS user group
  become: yes
  user:
    name: "{{ item }}"
    groups: cmsuser
    append: yes
  loop: "{{ additional_cms_users }}"
  notify: Restart CMS

- name: Reset SSH connection to allow user changes to affect current Ansible user
  meta: reset_connection

- name: Ensure CMS repo directory exists
  become: yes
  file:
    path: /opt/cms
    owner: cmsuser
    group: cmsuser
    mode: "0775"
    follow: yes
    state: directory

- name: Ensure CMS installation directory exists
  become: yes
  file:
    path: /home/cmsuser/cms
    owner: cmsuser
    group: cmsuser
    mode: "0755"
    state: directory

- name: Ensure CMS parent directories exist
  become: yes
  file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
    follow: no
    state: directory
  with_items:
    - /var/local/log
    - /var/local/cache
    - /var/local/lib
    - /var/local/run
    - /usr/local/include
    - /usr/local/share

- name: Ensure CMS directories exist
  become: yes
  file:
    path: "{{ item }}"
    owner: cmsuser
    group: cmsuser
    mode: "0770"
    follow: yes
    state: directory
  with_items:
    - /var/local/cache/cms
    - /var/local/run/cms
    - /usr/local/include/cms
    - /usr/local/share/cms

- name: Ensure CMS and CMS ranking parent directories exist
  become: yes
  file:
    path: "{{ item }}"
    owner: cmsuser
    group: cmsuser
    mode: "0775"
    follow: yes
    state: directory
  with_items:
    - /var/local/log/cms
    - /var/local/lib/cms

- name: Ensure CMS ranking directory exists
  become: yes
  file:
    path: "{{ item }}"
    owner: cmsrankinguser
    group: cmsrankinguser
    mode: "0755"
    follow: yes
    state: directory
  with_items:
    - /var/local/lib/cms/ranking
    - /var/local/log/cms/ranking
  when: '"cms_ranking" in services'

- name: Check out the CMS repository
  become: yes
  become_user: cmsuser
  git:
    repo: "{{ cms_repo }}"
    version: "{{ cms_version }}"
    dest: /opt/cms
    accept_hostkey: yes
    depth: 1
  register: cms_git_checkout_result

- name: Check whether the CMS install commit marker exists
  stat:
    path: /opt/cms_installed_git_commit
  changed_when: no
  check_mode: no # Run even when Ansible is run in check mode
  register: cms_installed_git_commit_file

- name: Read CMS install commit marker
  slurp:
    src: /opt/cms_installed_git_commit
  changed_when: no
  check_mode: no # Run even when Ansible is run in check mode
  when: cms_installed_git_commit_file.stat.exists
  register: slurp_cms_installed_git_commit_result

- name: Install CMS using its supported installer
  become: yes
  become_user: cmsuser
  command:
    argv:
      - /opt/cms/install.py
      - --dir=/home/cmsuser/cms
      - --skip-isolate
      - cms
  args:
    chdir: /opt/cms
  when: cms_git_checkout_result.get('after', '<cms_git_checkout_skipped>') != (slurp_cms_installed_git_commit_result.get('content', '') | b64decode | trim)
  notify: Restart CMS

- name: Write latest Git commit hash to cms_installed_git_commit file
  become: yes
  template:
    src: cms_installed_git_commit.j2
    dest: /opt/cms_installed_git_commit
    owner: cmsuser
    mode: "0664"

- name: Copy Polygon testlib
  become: yes
  copy:
    src: /opt/cms/cmscontrib/loaders/polygon/testlib.h
    dest: /usr/local/include/cms/testlib.h
    remote_src: yes
    follow: yes
    owner: root
    group: root

- name: Copy CMS configuration file
  include_tasks: copy_config.yml
  tags: always

- name: Migrate CMS DB
  include_tasks: migrate_db.yml
  when: run_db_migration | bool
  tags: always

- name: Create and enable CMS systemd services
  include_tasks: setup_services.yml
  tags: always

- name: Flush CMS restart handlers
  meta: flush_handlers
  tags: always
