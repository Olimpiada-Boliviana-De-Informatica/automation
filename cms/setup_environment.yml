- name: Install Isolate prerequisite packages
  hosts: cms_worker
  become: yes
  gather_facts: no
  tasks:
    - name: Install required packages individually
      package:
        name: "{{ item }}"
        state: present
      loop:
        - build-essential
        - pkg-config
        - libsystemd-dev
      tags: packages

- name: Remove known_hosts entries for all inventory hosts
  hosts: localhost
  tasks:
    - name: Loop through all inventory hosts and remove known_hosts entries
      ansible.builtin.shell: ssh-keygen -f "/home/sam/.ssh/known_hosts" -R "{{ item }}"
      with_items: "{{ groups['all'] }}"

- name: Create CMS user, grant sudo privileges
  hosts: all
  become: yes
  tasks:
    - name: Ensure the cms user exists
      ansible.builtin.user:
        name: cmsuser
        state: present
        shell: /bin/bash
        groups: sudo
        append: yes

    - name: Ensure sudo privileges for cms user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/cmsuser
        content: |
          cmsuser ALL=(ALL) NOPASSWD:ALL
        owner: root
        group: root
        mode: '0440'

    - name: Verify cms user has sudo privileges
      ansible.builtin.command: sudo -l -U cmsuser

    - name: Create .ssh directory for cms user
      ansible.builtin.file:
        path: /home/cmsuser/.ssh
        state: directory
        owner: cmsuser
        group: cmsuser
        mode: '0700'

    - name: Copy public SSH key to authorized_keys
      ansible.builtin.copy:
        src: /home/sam/.ssh/id_rsa.pub
        dest: /home/cmsuser/.ssh/authorized_keys
        owner: cmsuser
        group: cmsuser
        mode: '0600'

    - name: Verify SSH key permissions
      ansible.builtin.command: ls -l /home/cmsuser/.ssh
      register: ssh_dir_contents

    - name: Show contents of .ssh directory
      debug:
        var: ssh_dir_contents.stdout_lines

    - name: Update package list
      ansible.builtin.apt:
        update_cache: yes
