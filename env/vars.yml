### CMS ###

cms_repo: https://github.com/cms-dev/cms.git
cms_version: main

ansible_user: ansible
cms_db: cmsdb
cms_db_user: cmsuser
cms_db_pass: "{{ lookup('ansible.builtin.env', 'CMS_DB_PASS') | mandatory }}"
cms_db_host: "{{ groups['cms_db'][0] }}"

cms_secret_key: "{{ lookup('ansible.builtin.env', 'CMS_SECRET_KEY') | mandatory }}"

cms_contest_web_services_per_host: 1
cms_contest_web_fqdn: nivel2.obi.org.bo # TODO

cms_admin_web_fqdn: admin.nivel2.obi.org.bo # TODO
cms_admin_web_auth_basic_user: ioi
cms_admin_web_auth_basic_pass: "{{ lookup('ansible.builtin.env', 'CMS_ADMIN_WEB_AUTH_BASIC_PASS') | mandatory }}"

cms_ranking_user: cmsuser
cms_ranking_pass: "{{ lookup('ansible.builtin.env', 'CMS_RANKING_PASS') | mandatory }}"

cms_ranking_fqdn: score.nivel2.obi.org.bo # TODO

cms_worker_services_per_host: 3

